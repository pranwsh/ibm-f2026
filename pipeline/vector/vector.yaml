data_dir: /var/lib/vector
api:
  enabled: true
  address: 0.0.0.0:8686
sources:
  raw_events:
    type: kafka
    bootstrap_servers: kafka:29092
    group_id: vector-normalizer
    topics: [raw-events]
    decoding: {codec: json}
transforms:
  normalize:
    type: remap
    inputs: [raw_events]
    source: |-
      if !exists(.source_id) || !is_object(.record) {
        .error = "invalid raw record"
        .original = .
      } else {
        .event_id = if exists(.record.event_id) { .record.event_id } else { uuid_v4() }
        .source_id = .source_id
        .event_type = if exists(.record.event_type) { .record.event_type } else { "unknown" }
        .occurred_at = if exists(.record.occurred_at) { .record.occurred_at } else { .received_at }
        .payload = if exists(.record.payload) { .record.payload } else { .record }
        .normalized_at = now()
      }
  valid_events:
    type: filter
    inputs: [normalize]
    condition: |
      is_object(.record) && exists(.source_id)
  invalid_events:
    type: filter
    inputs: [normalize]
    condition: |
      !is_object(.record) || !exists(.source_id)
sinks:
  normalized_events:
    type: kafka
    inputs: [valid_events]
    bootstrap_servers: kafka:29092
    topic: normalized-events
    encoding: {codec: json}
    key_field: source_id
  quarantine_events:
    type: kafka
    inputs: [invalid_events]
    bootstrap_servers: kafka:29092
    topic: quarantine
    encoding: {codec: json}
    key_field: source_id
  detection_signals:
    type: kafka
    inputs: [valid_events]
    bootstrap_servers: kafka:29092
    topic: detection-signals
    encoding: {codec: json}
    key_field: signal_id
  clickhouse_events:
    type: clickhouse
    inputs: [valid_events]
    endpoint: http://clickhouse:8123
    database: ${CLICKHOUSE_DB:-analytics}
    table: events
    auth:
      strategy: basic
      user: default
      password: ${CLICKHOUSE_PASSWORD}
