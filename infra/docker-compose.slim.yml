# Provisional low-memory settings for 16 GB laptops. Confirm against the W3-4 reference.
services:
  postgres:
    command: [postgres, -c, shared_buffers=256MB, -c, work_mem=4MB, -c, max_connections=50]
  kafka:
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
  clickhouse:
    environment:
      CLICKHOUSE_MAX_MEMORY_USAGE: 1500000000
